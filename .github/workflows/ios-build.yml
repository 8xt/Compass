name: ios-build

# Builds an UNSIGNED .ipa for sideloading (Sideloadly / AltStore / SideStore sign it
# with your own Apple ID when installing). Run it from the Actions tab, or push to
# the ios-port branch.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  COMPASS_CAPSTAN_OPTIONAL: "1"

jobs:
  ipa:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install iOS tooling
        run: brew install xcodegen

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
          key: ios

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Generate Xcode project
        run: pnpm tauri ios init --ci

      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail
          # This Tauri CLI has no --no-sign. Arguments after `--` go to xcodebuild, so the
          # archive is built unsigned. The export step afterwards needs a signing identity
          # and is expected to fail; only a missing archive counts as a failed build.
          pnpm tauri ios build --ci --target aarch64 --verbose -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" 2>&1 | tee build.log || true
          if ! find src-tauri/gen/apple/build -maxdepth 2 -name '*.xcarchive' | grep -q .; then
            echo "No .xcarchive produced"
            exit 1
          fi

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface the failure as annotations, readable through the API without log access.
          { grep -nE '(^|[^a-z])(error|Error|ERROR|failed|FAILED)' build.log | grep -v 'warning' | head -25; echo '----- tail -----'; tail -60 build.log; } > report.txt || true
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path("report.txt").read_text(errors="replace")
          chunks = [t[i:i+4000] for i in range(0, len(t), 4000)][-10:]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=build-log-{n}::{c}")
          PY

      - name: Package IPA
        run: |
          set -euo pipefail
          ARCHIVE="$(find src-tauri/gen/apple/build -maxdepth 2 -name '*.xcarchive' | head -1)"
          if [ -n "$ARCHIVE" ]; then
            APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          else
            APP="$(find src-tauri/gen/apple/build -name '*.app' -path '*iphoneos*' | head -1)"
          fi
          echo "App bundle: $APP"
          test -d "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Compass-unsigned.ipa Payload)
          ls -lh Compass-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Compass-iOS-unsigned-ipa
          path: Compass-unsigned.ipa
          retention-days: 14
