name: ios-build

# Builds an UNSIGNED .ipa for sideloading (Sideloadly / AltStore / SideStore sign it
# with your own Apple ID when installing). Run it from the Actions tab, or push to
# the ios-port branch.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  COMPASS_CAPSTAN_OPTIONAL: "1"
  CI: "true"
  # Xcode's "Build Rust Code" phase runs pnpm in its own environment; without these,
  # pnpm decides node_modules is stale and aborts trying to purge it.
  pnpm_config_verify_deps_before_run: "false"
  npm_config_verify_deps_before_run: "false"
  pnpm_config_confirm_modules_purge: "false"
  npm_config_confirm_modules_purge: "false"

jobs:
  ipa:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install iOS tooling
        run: brew install xcodegen

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
          key: ios

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Download VLC for iOS (MobileVLCKit)
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the newest MobileVLCKit 3.x from the CocoaPods CDN and fetch its binary.
          SHARD=$(python3 -c "import hashlib;h=hashlib.md5(b'MobileVLCKit').hexdigest();print(h[0]+'/'+h[1]+'/'+h[2])")
          FLAT=$(echo "$SHARD" | tr '/' '_')
          curl -fsSL --retry 5 "https://cdn.cocoapods.org/all_pods_versions_${FLAT}.txt" -o pods.txt
          VER=$(python3 -c "
          import re
          line=[l for l in open('pods.txt').read().splitlines() if l.startswith('MobileVLCKit/')][0]
          vs=[v for v in line.split('/')[1:] if re.fullmatch(r'3\.\d+\.\d+', v)]
          vs.sort(key=lambda v: tuple(map(int, v.split('.'))))
          print(vs[-1])")
          curl -fsSL --retry 5 "https://cdn.cocoapods.org/Specs/${SHARD}/MobileVLCKit/${VER}/MobileVLCKit.podspec.json" -o vlc.podspec.json
          URL=$(python3 -c "import json;print(json.load(open('vlc.podspec.json'))['source']['http'])")
          echo "MobileVLCKit $VER from $URL"
          curl -fL --retry 5 "$URL" -o vlc.archive
          mkdir -p vlc && (tar -xf vlc.archive -C vlc 2>/dev/null || unzip -q vlc.archive -d vlc)
          XC=$(find vlc -name 'MobileVLCKit.xcframework' -type d | head -1)
          test -n "$XC"
          DEST=src-tauri/plugins/ios-media/ios/Frameworks
          mkdir -p "$DEST" && rm -rf "$DEST/MobileVLCKit.xcframework"
          cp -R "$XC" "$DEST/"
          ls "$DEST/MobileVLCKit.xcframework"
          BIN=$(find "$DEST/MobileVLCKit.xcframework" -path '*ios-arm64*' -not -path '*simulator*' -name MobileVLCKit -type f | head -1)
          file "$BIN"
          # Device slice as a plain framework, for the Swift plugin compile and the Rust link.
          FW=$(dirname "$BIN")
          mkdir -p "$DEST/device" && rm -rf "$DEST/device/MobileVLCKit.framework"
          cp -R "$FW" "$DEST/device/"
          ls "$DEST/device/MobileVLCKit.framework" "$DEST/device/MobileVLCKit.framework/Modules" || true
          rm -rf vlc vlc.archive

      - name: Generate Xcode project
        run: pnpm tauri ios init --ci

      - name: Disable code signing in the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          python3 - <<'PY'
          import pathlib, re
          # project.yml: tauri may regenerate the project from it during the build.
          y = pathlib.Path("project.yml")
          t = y.read_text()
          flags = ("        CODE_SIGNING_ALLOWED: NO\n"
                   "        CODE_SIGNING_REQUIRED: NO\n"
                   "        CODE_SIGN_IDENTITY: \"\"\n"
                   "        CODE_SIGN_STYLE: Manual\n"
                   "        DEVELOPMENT_TEAM: \"\"\n")
          t, n = re.subn(r"(\n      base:\n)", lambda m: m.group(1) + flags, t)
          print("project.yml base blocks patched:", n)
          y.write_text(t)
          PY
          # Xcode's "Build Rust Code" phase calls `pnpm tauri ios xcode-script`. pnpm then
          # re-verifies node_modules in Xcode's stripped environment and aborts. Call the
          # CLI binary directly instead.
          TAURI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/tauri"
          test -x "$TAURI_BIN"
          sed -i '' "s#pnpm tauri ios xcode-script#$TAURI_BIN ios xcode-script#g; s#pnpm run tauri ios xcode-script#$TAURI_BIN ios xcode-script#g" project.yml
          grep -n 'xcode-script' project.yml
          # Xcode 26 resolves $(TOOLCHAIN_DIR) to the Metal toolchain, so the Swift
          # compatibility libs (swiftCompatibility56...) are not found at link time.
          # Point the search paths at the default Swift toolchain explicitly.
          sed -i '' 's#\$(TOOLCHAIN_DIR)/usr/lib/swift#$(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift#g' project.yml
          grep -n 'LIBRARY_SEARCH_PATHS' project.yml || true
          # Link MobileVLCKit into the app (the Swift plugin uses it).
          pip3 install --break-system-packages --quiet pyyaml || pip3 install --quiet pyyaml
          VLC_XC="$GITHUB_WORKSPACE/src-tauri/plugins/ios-media/ios/Frameworks/MobileVLCKit.xcframework"
          VLC_BIN=$(find "$VLC_XC" -path '*ios-arm64*' -not -path '*simulator*' -name MobileVLCKit -type f | head -1)
          if file "$VLC_BIN" | grep -q 'dynamically linked'; then VLC_EMBED=true; else VLC_EMBED=false; fi
          VLC_XC="$VLC_XC" VLC_EMBED="$VLC_EMBED" python3 - <<'PY'
          import os, yaml
          spec = yaml.safe_load(open("project.yml"))
          name = next(n for n in spec["targets"] if n.endswith("_iOS"))
          target = spec["targets"][name]
          deps = target.setdefault("dependencies", [])
          deps.append({"framework": os.environ["VLC_XC"], "embed": os.environ["VLC_EMBED"] == "true"})
          for sdk in ["libc++.tbd", "libxml2.tbd", "libz.tbd", "libbz2.tbd", "libiconv.tbd",
                      "VideoToolbox.framework", "CoreMedia.framework", "CoreVideo.framework",
                      "AudioToolbox.framework", "AVFoundation.framework", "CoreText.framework",
                      "MediaPlayer.framework", "OpenGLES.framework", "CFNetwork.framework"]:
              deps.append({"sdk": sdk})
          yaml.safe_dump(spec, open("project.yml", "w"), sort_keys=False)
          print("linked MobileVLCKit into", name, "embed:", os.environ["VLC_EMBED"])
          PY
          xcodegen generate --spec project.yml
          # Belt and braces: patch the generated pbxproj too.
          PBX="$(ls -d *.xcodeproj)/project.pbxproj"
          sed -i '' -E \
            -e 's/CODE_SIGN_IDENTITY(\[[^]]*\])? = [^;]*;/CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PBX"
          grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBX"
          grep -n 'base:' -A8 project.yml | head -40

      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail
          # Signing is switched off in the project above. The export step afterwards needs a
          # signing identity and is expected to fail; only a missing archive is a failure.
          pnpm tauri ios build --ci --target aarch64 --verbose 2>&1 | tee build.log || true
          if ! find src-tauri/gen/apple/build -maxdepth 2 -name '*.xcarchive' | grep -q .; then
            echo "No .xcarchive produced"
            exit 1
          fi

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface the failure as annotations, readable through the API without log access.
          { grep -nE '(^|[^a-z])(error|Error|ERROR|failed|FAILED)' build.log | grep -v 'warning' | head -25; echo '----- tail -----'; tail -60 build.log; } > report.txt || true
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path("report.txt").read_text(errors="replace")
          chunks = [t[i:i+4000] for i in range(0, len(t), 4000)][-10:]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=build-log-{n}::{c}")
          PY

      - name: Package IPA
        run: |
          set -euo pipefail
          ARCHIVE="$(find src-tauri/gen/apple/build -maxdepth 2 -name '*.xcarchive' | head -1)"
          if [ -n "$ARCHIVE" ]; then
            APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          else
            APP="$(find src-tauri/gen/apple/build -name '*.app' -path '*iphoneos*' | head -1)"
          fi
          echo "App bundle: $APP"
          test -d "$APP"
          EXE="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          # Every @rpath library the app needs at launch must be inside the bundle,
          # or iOS kills the app before it shows anything.
          VLC_DEVICE="$GITHUB_WORKSPACE/src-tauri/plugins/ios-media/ios/Frameworks/device/MobileVLCKit.framework"
          if otool -L "$EXE" | grep -q '@rpath/MobileVLCKit.framework'; then
            mkdir -p "$APP/Frameworks"
            if [ ! -d "$APP/Frameworks/MobileVLCKit.framework" ]; then
              cp -R "$VLC_DEVICE" "$APP/Frameworks/"
              echo "::warning::MobileVLCKit is dynamic and was not embedded; copied it into the app."
            fi
            if ! otool -l "$EXE" | grep -A2 LC_RPATH | grep -q '@executable_path/Frameworks'; then
              install_name_tool -add_rpath @executable_path/Frameworks "$EXE"
            fi
          fi
          MISSING=""
          for lib in $(otool -L "$EXE" | awk 'NR>1 {print $1}' | grep '^@rpath/'); do
            rel="${lib#@rpath/}"
            [ -e "$APP/Frameworks/$rel" ] || MISSING="$MISSING $lib"
          done
          DEPS=$(otool -L "$EXE" | awk 'NR>1 {print $1}' | grep -v '^/System/\|^/usr/lib/' | tr '\n' ' ')
          echo "::notice title=app-deps::non-system deps: ${DEPS:-none} | Frameworks/: $(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ') | missing:${MISSING:- none}"
          [ -z "$MISSING" ] || { echo "::error::app links libraries that are not in the bundle:$MISSING"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Compass-unsigned.ipa Payload)
          ls -lh Compass-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Compass-iOS-unsigned-ipa
          path: Compass-unsigned.ipa
          retention-days: 14
