name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [beta-branch]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # The extension compat layer is not in this repository, so a runner cannot stage its runtime and
  # this installer ships without extension support. Same setting as tauri-build.yml and
  # app-build.yml: drop it the day the layer ships with the checkout.
  COMPASS_CAPSTAN_OPTIONAL: "1"

jobs:
  build:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compass-core
            src-tauri
            installer/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Pokémon engine SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # src-tauri/resources/pokemon-engine/ is a bundle resource and is gitignored, so the build
      # stops at "resource path doesn't exist" without this step.
      - name: Build Pokémon engine and corresponding source bundle
        run: node tools/pokemon-engine/build.mjs --fetch-source "${{ runner.temp }}/compass-pokemon-source" --output src-tauri/resources/pokemon-engine --artifacts "${{ runner.temp }}/compass-pokemon-build"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify HTTP redirect boundaries
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --manifest-path scripts/http-redirect-tests/Cargo.toml --locked --lib

      # libmpv-2.dll is gitignored and checksum-pinned in scripts/fetch-libmpv.mjs. It is downloaded
      # from a release asset of this repository unless the repository variable COMPASS_LIBMPV_URL
      # names a mirror. The pinned SHA-256 is verified either way.
      - name: Fetch libmpv
        env:
          COMPASS_LIBMPV_URL: ${{ vars.COMPASS_LIBMPV_URL || format('https://github.com/{0}/releases/download/mpvdll-0a81c004aae0/libmpv-2.dll', github.repository) }}
        run: pnpm run setup:libmpv

      - name: Fetch mpv
        run: pnpm run setup:mpv

      - name: Fetch sidecar binaries (yt-dlp, ffmpeg, ffprobe)
        run: pnpm run setup:binaries

      - name: Verify bundled fonts
        run: pnpm run setup:fonts

      - name: compass-core check
        working-directory: compass-core
        run: |
          cargo check
          cargo test --all-targets

      # beforeBuildCommand (pnpm build:desktop) stages Capstan, type-checks and builds the frontend.
      - name: Build NSIS installer
        run: pnpm tauri build --target ${{ env.TARGET }} --bundles nsis

      - name: Build verified Windows managed installer
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $releaseRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force -Path 'src-tauri/target/release' | Out-Null
          Copy-Item -LiteralPath "$releaseRoot/compass.exe" -Destination 'src-tauri/target/release/compass.exe'
          cargo build --manifest-path installer/src-tauri/Cargo.toml --release --no-default-features --features tauri/custom-protocol --bin compass-uninstall --locked
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller build failed' }
          node installer/scripts/make-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload creation failed' }
          node scripts/verify-managed-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload verification failed' }
          cargo build --manifest-path installer/src-tauri/Cargo.toml --release --features tauri/custom-protocol --bin compass-setup --locked
          if ($LASTEXITCODE -ne 0) { throw 'Managed installer build failed' }
          node scripts/verify-managed-payload.mjs --embedded
          if ($LASTEXITCODE -ne 0) { throw 'Embedded payload verification failed' }
          foreach ($releaseExe in @('src-tauri/target/release/compass.exe', 'installer/src-tauri/target/release/compass-uninstall.exe', 'installer/src-tauri/target/release/compass-setup.exe')) {
            if ((Get-Item -LiteralPath $releaseExe).VersionInfo.FileVersion -ne $releaseVersion) { throw "Wrong version: $releaseExe" }
          }
          New-Item -ItemType Directory -Force -Path "$releaseRoot/bundle/managed" | Out-Null
          Copy-Item -LiteralPath 'installer/src-tauri/target/release/compass-setup.exe' -Destination "$releaseRoot/bundle/managed/Compass_${releaseVersion}_x64-installer.exe"

      - name: List produced installers
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $found = Get-ChildItem -Path $bundle -Recurse -Filter *.exe -File
          if (-not $found) { throw "No .exe installer was produced under $bundle" }
          $found | ForEach-Object { '{0}  {1:N1} MB' -f $_.FullName.Substring((Get-Location).Path.Length + 1), ($_.Length / 1MB) }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: compass-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/managed/*.exe
          retention-days: 14
          if-no-files-found: error
